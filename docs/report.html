<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrobble Drift — saved report</title>
<!-- Version query busts the GitHub Pages asset cache. Keep in step with
     index.html when style.css changes. -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
  <h1>Saved report<span class="dot">.</span></h1>
  <div class="nav">
    <a href="./">Scan a library</a>
    <a href="https://github.com/ArjanKnol/scrobble-drift">Source</a>
  </div>
  <div id="app"><div class="note">Loading…</div></div>

  <footer class="attrib">
    <span>Powered by</span>
    <a class="lfm" href="https://www.last.fm/" target="_blank"
       rel="noopener noreferrer" aria-label="Last.fm">
      <span class="lfm-logo"><img
        src="https://www.last.fm/static/images/lastfm_logo_facebook.15d8133be114.png"
        alt="Last.fm" width="106" loading="lazy"
        onerror="this.closest('.lfm-logo').style.display='none';
                 this.closest('.lfm').querySelector('.lfm-fallback')
                     .style.display='inline-flex'"></span>
      <span class="lfm-fallback"><span class="mark" aria-hidden="true">as</span>Last.fm</span>
    </a>
    <span class="sep">|</span>
    <span>Metadata from
      <a href="https://musicbrainz.org/" target="_blank"
         rel="noopener noreferrer">MusicBrainz</a></span>
    <span class="sep">|</span>
    <span>Not affiliated with Last.fm Ltd.</span>
  </footer>
</div>

<script>
/* Renders docs/report.json, written by the monthly GitHub Action. No API proxy
   involved: this is a committed file, so this page works on plain Pages. */
const N = n => (n ?? 0).toLocaleString();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = s => esc(String(s).replace('␟', ' — '));
const col = v => v >= 85 ? 'var(--good)' : v >= 60 ? 'var(--warn)' : 'var(--bad)';
const metric = (n, l, c) =>
  `<div class="panel metric"><div class="n"${c ? ` style="color:${c}"` : ''}>${n}</div>
   <div class="l">${l}</div></div>`;

let R = null, fDet = '', fCls = '';

fetch('report.json?' + Date.now())
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { R = d; render(); })
  .catch(() => {
    document.getElementById('app').innerHTML = `
      <div class="panel">
        <strong>No saved report yet.</strong>
        <p class="note">The monthly scan writes <code>docs/report.json</code>.
        Run it from Actions → <em>scan</em> → Run workflow, or locally:</p>
        <div class="setup"><pre>python scripts/run.py --resolve</pre></div>
        <p class="note">Or <a href="./">scan any library live</a> instead, which
        needs no saved file.</p>
      </div>`;
  });

function render() {
  const d = R, p = d.profile, h = d.hygiene, era = d.era, im = d.impact;
  const when = new Date(d.generated * 1000).toISOString().slice(0, 16).replace('T', ' ');

  document.getElementById('app').innerHTML = `
    <div class="sub">${esc(d.user)} · ${N(p.scrobbles_ingested)} scrobbles ·
      generated ${when} UTC · ${d.resolved
        ? `${N(d.musicbrainz_lookups)} MusicBrainz lookups`
        : 'local detectors only'}</div>

    <div class="grid g2">
      <div class="panel">
        <div class="score" style="color:${col(h.score)}">${h.score}<span
          style="font-size:18px;color:var(--dim)">/100</span></div>
        <div class="l" style="color:var(--dim);font-size:12px;margin-bottom:12px">
          hygiene score</div>
        ${Object.entries(h.subscores || {}).map(([k, v]) => `
          <div style="margin-bottom:9px">
            <div class="row" style="border:0;padding:0">
              <span>${esc(k.replace(/_/g, ' '))}</span><span class="v">${v}</span></div>
            <div class="bar"><i style="width:${v}%;background:${col(v)}"></i></div>
          </div>`).join('')}
      </div>
      <div class="grid g4">
        ${metric(N(p.distinct_albums), 'album strings')}
        ${metric(N(p.distinct_artists), 'artists')}
        ${metric(N(d.issues_total), 'issues found')}
        ${metric((p.scrobbles_ingested / Math.max(p.distinct_albums, 1)).toFixed(1),
                 'plays per album string')}
      </div>
    </div>

    ${era && era.plays ? `
      <h2>Unreleased, tagged by era</h2>
      <div class="panel grid g2">
        <div class="grid g4" style="align-content:start">
          ${metric(era.share_of_all_plays + '%', 'of all scrobbles', 'var(--era)')}
          ${metric(N(era.plays), 'era-tagged plays')}
          ${metric(N(era.album_strings), 'era album strings')}
          ${metric(N(era.distinct_eras), 'distinct eras')}
        </div>
        <div>${(era.top_albums || []).slice(0, 12).map(a =>
          `<div class="row"><span>${KEY(a.key)}</span>
           <span class="v">${N(a.plays)}</span></div>`).join('')}</div>
      </div>` : ''}

    ${im && im.biggest_movers && im.biggest_movers.length ? `
      <h2>Your chart, corrected</h2>
      ${im.number_one_changes ? `<div class="panel" style="border-color:var(--warn);
        margin-bottom:12px">Your true number one album is not the one Last.fm
        shows you.</div>` : ''}
      <div class="panel">${im.biggest_movers.slice(0, 14).map(m => `
        <div class="mv">
          <span class="${m.delta > 0 ? 'up' : 'down'}" style="width:64px;
            font-variant-numeric:tabular-nums">#${m.from} → #${m.to}</span>
          <span style="flex:1">${KEY(m.album)}</span>
          <span class="v" style="color:var(--dim)">
            ${N(m.plays_before)} → ${N(m.plays_after)}</span>
        </div>`).join('')}</div>` : ''}

    <h2>Issues</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <select id="fd"><option value="">All detectors</option>
        ${Object.entries(d.summary_by_detector)
          .sort((a, b) => b[1].plays_affected - a[1].plays_affected)
          .map(([k, v]) => `<option value="${k}">${k} — ${v.count} issue(s),
            ${N(v.plays_affected)} plays</option>`).join('')}</select>
      <select id="fc"><option value="">All classes</option>
        ${[...new Set(d.issues.map(i => i.class))].sort()
          .map(c => `<option value="${c}">${c}</option>`).join('')}</select>
    </div>
    <div id="issues"></div>`;

  const fd = document.getElementById('fd'), fc = document.getElementById('fc');
  fd.value = fDet; fc.value = fCls;
  fd.onchange = e => { fDet = e.target.value; issues(); };
  fc.onchange = e => { fCls = e.target.value; issues(); };
  issues();
}

function issues() {
  const list = R.issues.filter(i =>
    (!fDet || i.detector === fDet) && (!fCls || i.class === fCls)).slice(0, 200);
  document.getElementById('issues').innerHTML = list.length ? list.map(i => `
    <div class="issue">
      <h3>${esc(i.title)}</h3>
      <div>
        <span class="tag t-${i.class}">${i.class}</span>
        <span class="tag">${i.detector}</span>
        <span class="tag">${N(i.plays_affected)} plays</span>
        <span class="tag">confidence ${Math.round((i.confidence || 0) * 100)}%</span>
        ${i.no_auto_action ? '<span class="tag t-review">verify manually</span>' : ''}
      </div>
      ${i.suggest ? `<p>${esc(i.suggest)}</p>` : ''}
      ${i.temporal ? `<p style="color:var(--warn)">${esc(i.temporal.note)}</p>` : ''}
      ${(i.members || []).length ? `<div class="mem">${i.members.slice(0, 8).map(m => {
        const label = m.album ?? m.artist ?? m.track ?? m.era ?? m.month ?? m.mbid ?? '';
        const n = m.plays ?? m.dupes ?? null;
        return `<code>${esc(label)}</code>${n !== null ? ' ' + N(n) : ''}${
          m.looks_like ? ` <span style="opacity:.65">(${esc(m.looks_like)})</span>` : ''}`;
      }).join(' &nbsp;·&nbsp; ')}</div>` : ''}
    </div>`).join('') : '<div class="panel">Nothing matches that filter.</div>';
}
</script>
</body>
</html>
