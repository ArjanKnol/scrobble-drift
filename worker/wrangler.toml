name = "scrobble-drift-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# workers.dev is how the frontend reaches this, so it stays on.
workers_dev = true

# Preview URLs off. They are enabled by default, which would expose this proxy
# at an extra per-version hostname for every deployment. Each one spends the
# same Last.fm key and is not in ALLOWED_ORIGINS, so they add attack surface
# and no value here.
preview_urls = false

# Set the key as a secret, never here:
#   npx wrangler secret put LASTFM_API_KEY
#
# wrangler.toml IS committed, so anything in [vars] is public. Only
# non-sensitive config belongs below.

[vars]
# Comma-separated origin allowlist. The GitHub Pages origin is the one that
# matters: the frontend is served from there, the Worker only proxies.
#
# Note this is an ORIGIN, so no repo path and no trailing slash. The site lives
# at https://arjanknol.github.io/scrobble-drift/ but the origin is just
# https://arjanknol.github.io
#
# Never use "*" on a deployed Worker. This one spends a real API key, and an
# open CORS policy lets any website on the internet spend it for you.
# scrobble-drift.pages.dev is the public URL (no personal name in it).
# arjanknol.github.io stays listed so the older link keeps working.
# Cloudflare Pages also serves every branch at <hash>.scrobble-drift.pages.dev;
# those are NOT listed, deliberately, so preview builds cannot spend the key.
ALLOWED_ORIGINS = "https://scrobble-drift.pages.dev,https://arjanknol.github.io,http://localhost:8000,http://127.0.0.1:8000"

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
# Requires wrangler 4.36.0 or later. No storage to provision, no KV namespace,
# nothing to create by hand: deploy and these exist.
#
# Sizing works backwards from what a scan actually costs upstream. Each page is
# 200 scrobbles, and the Worker fetches at most 8 pages per request:
#
#   2,000 scrobbles  =  10 pages  =  2 requests
#  10,000 scrobbles  =  50 pages  =  7 requests
# 140,000 scrobbles  = 700 pages  = 88 requests
#
# `period` may only be 10 or 60 seconds, so these are burst limiters, not
# daily quotas. And per Cloudflare's docs the counters are PER LOCATION and
# eventually consistent, so RL_SHARED is a coarse backstop rather than a true
# global cap. A real global counter needs Durable Objects (Workers Paid).
# The pacing, circuit breaker, edge cache and own-key path in src/index.js are
# what actually carry load; these three stop the obvious abuse.

# Concurrency guard. One check per scan request, so a single client cannot open a
# dozen parallel scans.
#
# 15, not 6. The old value was described as "generous for one sequential scan"
# and the arithmetic says otherwise: a request carries 8 pages spaced by
# PACE_MS (130ms), so it occupies roughly 0.9s of Worker time plus latency, and
# one sequential scan therefore issues 7 to 9 requests per 10 seconds. It sat
# just under the limit and tripped it continuously, so every large scan stalled
# with "Too many scan requests at once" through no fault of the user.
#
# This limiter exists to stop someone running scans in parallel. It should never
# fire for a single well-behaved client, and 15 leaves clear headroom above the
# ~9 a normal scan produces while still catching a loop. The client also paces
# itself to one request every 4 seconds now, which is the real defence; this is
# the backstop.
[[ratelimits]]
name = "RL_BURST"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 15
  period = 10

# Per-client page budget. 120 pages/min is roughly two 10k scans, or one 24k
# scan, per minute per IP. Charged once per upstream page, not per request.
[[ratelimits]]
name = "RL_PAGES"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

# Shared-key ceiling, charged on the same page fetches under a constant key.
# 240/min is roughly 4 upstream calls/second, which sits under the ~5/s that
# Last.fm is generally believed to tolerate. Remember this is per location, so
# worldwide traffic can exceed it: the circuit breaker is the real safety net.
[[ratelimits]]
name = "RL_SHARED"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 240
  period = 60

# ---------------------------------------------------------------------------
# MusicBrainz
# ---------------------------------------------------------------------------
# MusicBrainz allows ONE request per second per application and blocks IPs that
# exceed it. The only pacing that existed was a 1/s limiter in each visitor's
# BROWSER, which is per tab, so N concurrent visitors made N requests per second
# from Cloudflare IPs under one shared User-Agent.
#
# These two need no provisioning and take effect on the next deploy.

# Per-visitor MusicBrainz budget. A big first scan legitimately needs a few
# hundred lookups, so this is deliberately loose: it exists to stop a script,
# not to slow down a real scan.
[[ratelimits]]
name = "RL_MB"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 90
  period = 60

# Shared MusicBrainz ceiling. 60/min is one per second, which is exactly what
# MusicBrainz asks for. Per location and eventually consistent, as with
# RL_SHARED, so it overshoots: the breaker and the shared cache are what carry
# the load. Set below the true limit on purpose, because the cost of guessing
# high is having our User-Agent blocked for everyone.
[[ratelimits]]
name = "RL_MB_SHARED"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 60
  period = 60

# ---------------------------------------------------------------------------
# Shared MusicBrainz answer cache (D1)
# ---------------------------------------------------------------------------
# There is deliberately NO d1_databases block here yet. A binding pointing at a
# database that does not exist makes `wrangler deploy` fail outright, and
# src/index.js treats MB_CACHE as optional on purpose: with no binding it asks
# MusicBrainz directly, exactly as it did before. So this file always deploys.
#
# To enable the cache:
#
#   npx wrangler d1 create scrobble-drift-cache
#     -> answer YES when it offers to add the binding to this file
#
#   The binding it adds is named after the database. The code expects MB_CACHE,
#   so rename it:
#     (Get-Content wrangler.toml -Raw) -replace 'binding = "scrobble_drift_cache"', 'binding = "MB_CACHE"' | Set-Content wrangler.toml
#
#   npx wrangler d1 execute scrobble-drift-cache --remote --file=./schema.sql
#   npx wrangler deploy
#
# Then /api/health reports "mb_cache": true and a row count.
#
# Free tier: 5 GB, 5 million rows read and 100,000 written per day. One row per
# answer at a few KB, so the practical ceiling is hundreds of thousands of
# cached artists.

[observability]
enabled = true

# The shared MusicBrainz answer cache described above. `binding` must stay
# MB_CACHE: src/index.js reads env.MB_CACHE and treats its absence as "no cache,
# ask MusicBrainz directly", so a renamed binding disables the cache silently
# rather than failing.
[[d1_databases]]
binding = "MB_CACHE"
database_name = "scrobble-drift-cache"
database_id = "a26c37b4-0251-4ca9-96cb-018de0a4648c"

